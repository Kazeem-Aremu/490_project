<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Homework Check — AI Feedback</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // Your Supabase project (the same one your signup page and dashboard use)
  var db = null;
  try {
    db = window.supabase.createClient(
      "https://xsfipfsslgdjnelbgypu.supabase.co",
      "sb_publishable_CCwu2bpoYWtXQFZbQU1nHA_5Pgl_5u_"
    );
  } catch (e) { console.error("Supabase:", e); }
</script>
<!-- Your chat box stylesheet (keep styles.css in the same folder as this page) -->
<link rel="stylesheet" href="styles.css" />
<style>
  /* Only the pieces added for file transfer; everything else comes from styles.css */
  .link-btn:disabled { color: var(--muted); cursor: default; }
  .attach { display: flex; flex-direction: column; gap: 6px; min-width: 200px; }
  .attach .fname { font-family: "JetBrains Mono", monospace; font-size: 12.5px; font-weight: 500; }
  .attach .fmeta { font-size: 11.5px; opacity: .8; }
  .attach .actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .me .attach .link-btn { color: #fff; text-decoration: underline; padding: 0; }
  .me .attach .link-btn:disabled { color: rgba(255,255,255,.7); text-decoration: none; }
  .clip {
    flex: none; width: 42px; display: grid; place-items: center; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--maroon); cursor: pointer; font-size: 18px;
  }
  .clip:hover { border-color: var(--maroon); background: #fbf6f7; }
  .clip input { display: none; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

const SNAPSHOT_LINES = 15;
const STORAGE_KEY = "submission";        // dashboard -> chat box
const TO_DASHBOARD_KEY = "chatbox_file"; // chat box -> dashboard
const MAX_ATTACH = 2 * 1024 * 1024;
const BUCKET = "homework-files"; // Supabase Storage bucket (see setup_files.sql)

/* ---------- Supabase file helpers ---------- */
const safeName = (n) => String(n).replace(/[^\w.\-]+/g, "_").slice(0, 120) || "file";

async function cloudUpload(user, blob, name, type, location, origin) {
  const path = `${user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${safeName(name)}`;
  const up = await db.storage.from(BUCKET).upload(path, blob, { contentType: type || "text/plain" });
  if (up.error) throw up.error;
  const ins = await db.from("files").insert({ location, name, path, size: blob.size, type: type || "", origin }).select().single();
  if (ins.error) { await db.storage.from(BUCKET).remove([path]); throw ins.error; }
  return ins.data;
}

async function cloudText(row) {
  const { data, error } = await db.storage.from(BUCKET).download(row.path);
  if (error) throw error;
  return await data.text();
}

/* ---------- Sends a file to the dashboard page ---------- */
function sendToDashboard(f) {
  const payload = { name: f.name, code: f.code, size: f.size, sentAt: Date.now() };
  let sent = false;
  // Works when this page was opened from the dashboard, even straight from a folder.
  if (window.opener && !window.opener.closed) {
    try { window.opener.postMessage({ type: "chatbox_file", ...payload }, "*"); sent = true; } catch (e) {}
  }
  // Also works when both pages are open from the same site in different tabs.
  try { localStorage.setItem(TO_DASHBOARD_KEY, JSON.stringify(payload)); sent = true; } catch (e) {}
  return sent;
}

/* ---------- The AI checks run on the submitted code ---------- */
function buildChecks(code) {
  const lines = code.split("\n");
  const longLines = lines.filter((l) => l.length > 100).length;
  const hasTabs = lines.some((l) => /^\t/.test(l));
  const hasSpaces = lines.some((l) => /^ {2,}/.test(l));
  const todos = (code.match(/\b(TODO|FIXME)\b/g) || []).length;
  const fnCount = (code.match(/\bdef\s+\w+|\bfunction\s+\w+|\w+\s*=\s*\(?[\w\s,]*\)?\s*=>|\b(public|private|static|void|int|String)\s+\w+\s*\(/g) || []).length;
  const commentCount = (code.match(/(^|\s)(#|\/\/|\/\*)/gm) || []).length;
  const returns = (code.match(/\breturn\b/g) || []).length;

  return [
    {
      label: "File received and readable",
      pass: code.trim().length > 0,
      detail: code.trim() ? `${lines.length} lines found` : "The file is empty",
    },
    {
      label: "Defines at least one function",
      pass: fnCount > 0,
      detail: fnCount ? `${fnCount} function${fnCount > 1 ? "s" : ""} found` : "No functions detected",
    },
    {
      label: "Functions return results",
      pass: returns > 0,
      detail: returns ? `${returns} return statement${returns > 1 ? "s" : ""}` : "No return statements found",
    },
    {
      label: "Code includes comments",
      pass: commentCount > 0,
      detail: commentCount ? `${commentCount} comment${commentCount > 1 ? "s" : ""} found` : "Add comments to explain your logic",
    },
    {
      label: "No unfinished TODO / FIXME notes",
      pass: todos === 0,
      detail: todos ? `${todos} left in the file` : "Looks finished",
    },
    {
      label: "Consistent indentation",
      pass: !(hasTabs && hasSpaces),
      detail: hasTabs && hasSpaces ? "Mix of tabs and spaces" : "Indentation is consistent",
    },
    {
      label: "Lines are a readable length",
      pass: longLines === 0,
      detail: longLines ? `${longLines} line${longLines > 1 ? "s" : ""} over 100 characters` : "All lines under 100 characters",
    },
  ];
}

/* ---------- Chat replies (replace with a real AI call later) ---------- */
function getReply(text, file, checks, analysisDone) {
  const t = text.toLowerCase();
  const failed = checks.filter((c) => c.pass === false);

  if (file && !analysisDone) return "I'm still checking your file — give me a second and ask again.";

  if (file && /(result|score|grade|pass|fail|how did|check)/.test(t)) {
    const passed = checks.length - failed.length;
    if (!failed.length) return `Your file ${file.name} passed all ${checks.length} checks. Nice work!`;
    return `${file.name} passed ${passed} of ${checks.length} checks.\n\nTo fix:\n` +
      failed.map((c) => `• ${c.label} — ${c.detail}`).join("\n");
  }
  if (/(save|dashboard|send)/.test(t)) {
    return "To move a file to your dashboard, attach it with the 📎 button and press \"Save to dashboard\" on it. The submitted file has the same button at the top.";
  }
  if (file && /(file|code|submit|upload)/.test(t)) {
    return `I can see ${file.name} (${file.lines} lines). Ask me about your results, or about any part of your code.`;
  }
  if (/\b(hi|hello|hey)\b/.test(t)) {
    return file
      ? `Hi! I've looked at ${file.name}. Want me to go over your results?`
      : "Hi! You can ask me anything about your homework, and once you submit your work I'll check it here.";
  }
  if (t.includes("?")) return "Good question — can you tell me a bit more about what you're thinking?";
  return file
    ? "Got it. Ask me about your results, or tell me which part of your code you'd like help with."
    : "Thanks! Once you submit your work I can check it — until then, keep asking questions here.";
}

function App() {
  const [file, setFile] = useState(null); // { name, size, lines, code }
  const [checks, setChecks] = useState([]); // each: {label, detail, pass, state}
  const [messages, setMessages] = useState([
    { id: 1, from: "bot", text: "Hi! Ask me anything about your homework. Once you submit your work, I'll check it here too." },
  ]);
  const [input, setInput] = useState("");
  const [typing, setTyping] = useState(false);
  const [savedIds, setSavedIds] = useState({}); // which files were saved to the dashboard
  const [sbUser, setSbUser] = useState(undefined); // Supabase student; undefined = still checking
  const endRef = useRef(null);
  const timers = useRef([]);
  const lastSent = useRef(null);

  const analysisDone = checks.length > 0 && checks.every((c) => c.state === "done");
  const passedCount = checks.filter((c) => c.state === "done" && c.pass).length;
  const doneCount = checks.filter((c) => c.state === "done").length;

  useEffect(() => {
    endRef.current?.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }, [messages, typing]);

  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  function addBot(text) {
    setMessages((m) => [...m, { id: Date.now() + Math.random(), from: "bot", text }]);
  }

  // Loads homework sent from the dashboard page.
  function loadSubmission(sub) {
    if (!sub || typeof sub.code !== "string") return;
    // The same file can arrive twice (saved storage + direct hand-off); only check it once
    if (sub.sentAt && lastSent.current === sub.sentAt) return;
    if (sub.sentAt) lastSent.current = sub.sentAt;
    const info = {
      id: "sub-" + (sub.sentAt || Date.now()),
      name: sub.name || "submission.txt",
      size: sub.size ?? new Blob([sub.code]).size,
      lines: sub.code.split("\n").length,
      code: sub.code,
      path: sub.path,
      type: sub.type,
      origin: sub.origin,
    };
    setFile(info);
    runChecks(info);
  }

  useEffect(() => {
    // 1) Same page: window.loadSubmission({ name, code })
    window.loadSubmission = loadSubmission;

    // 2) Saved before this page opened: localStorage "submission" = { name, code }
    //    (only used when the student isn't signed in to Supabase)
    const useLocal = () => {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) loadSubmission(JSON.parse(saved));
      } catch (e) {}
    };
    if (!db) { setSbUser(null); useLocal(); }
    else db.auth.getSession()
      .then(({ data }) => { const u = data.session ? data.session.user : null; setSbUser(u); if (!u) useLocal(); })
      .catch(() => { setSbUser(null); useLocal(); });

    // A new submission saved from another tab
    function onStorage(e) {
      if (e.key !== STORAGE_KEY || !e.newValue) return;
      try { loadSubmission(JSON.parse(e.newValue)); } catch (err) {}
    }
    // 3) Sent directly by the dashboard that opened this page
    function onMessage(e) {
      if (!window.opener || e.source !== window.opener) return;
      const d = e.data || {};
      if (d.type === "submission") loadSubmission(d);
    }
    window.addEventListener("storage", onStorage);
    window.addEventListener("message", onMessage);
    // Tell the dashboard this page is ready to receive a file.
    if (window.opener) { try { window.opener.postMessage({ type: "chatbox_ready" }, "*"); } catch (e) {} }
    return () => {
      window.removeEventListener("storage", onStorage);
      window.removeEventListener("message", onMessage);
    };
  }, []);

  // 4) Supabase: load the newest file sent from the dashboard, then listen for new ones
  useEffect(() => {
    if (!db || !sbUser) return;
    let alive = true;

    async function openRow(row, announce) {
      try {
        const code = await cloudText(row);
        if (!alive) return;
        if (code.includes("\u0000")) { addBot(`${row.name} isn't a text or code file, so I can't check it.`); return; }
        if (announce) {
          setMessages((m) => [...m, { id: "in-" + row.id, from: "me", file: { id: "row-" + row.id, name: row.name, size: row.size, lines: code.split("\n").length, code, path: row.path, type: row.type, fromDash: row.origin === "dashboard" } }]);
        }
        loadSubmission({ name: row.name, size: row.size, code, path: row.path, type: row.type, origin: row.origin, sentAt: "row-" + row.id });
      } catch (e) {
        console.error("Supabase:", e.message);
        addBot(`I couldn't open ${row.name} from your dashboard. Try sending it again.`);
      }
    }

    db.from("files").select("*").eq("location", "chat").in("origin", ["dashboard", "submission"])
      .order("created_at", { ascending: false }).limit(1)
      .then(({ data, error }) => {
        if (error) { console.error("Supabase:", error.message); return; }
        if (data && data[0]) openRow(data[0], false);
      });

    const chan = db.channel("chatbox-" + sbUser.id)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "files", filter: "user_id=eq." + sbUser.id }, (p) => {
        const row = p.new;
        if (row && row.location === "chat" && (row.origin === "dashboard" || row.origin === "submission")) openRow(row, true);
      })
      .subscribe();

    return () => { alive = false; db.removeChannel(chan); };
  }, [sbUser]);

  function runChecks(info) {
    timers.current.forEach(clearTimeout);
    timers.current = [];
    const results = buildChecks(info.code);
    setChecks(results.map((r) => ({ ...r, state: "pending" })));
    addBot(`Got ${info.name}! Checking it now…`);

    results.forEach((_, i) => {
      timers.current.push(setTimeout(() => {
        setChecks((cs) => cs.map((c, j) => (j === i ? { ...c, state: "running" } : c)));
      }, i * 700 + 200));
      timers.current.push(setTimeout(() => {
        setChecks((cs) => cs.map((c, j) => (j === i ? { ...c, state: "done" } : c)));
      }, i * 700 + 750));
    });

    timers.current.push(setTimeout(() => {
      const failed = results.filter((r) => !r.pass);
      addBot(failed.length
        ? `Done! ${info.name} passed ${results.length - failed.length} of ${results.length} checks. Ask me "what failed?" and I'll explain.`
        : `Done! ${info.name} passed all ${results.length} checks. Great job!`);
    }, results.length * 700 + 900));
  }

  // Attach a file in the chat
  function attachFile(f) {
    if (!f) return;
    if (f.size > MAX_ATTACH) { addBot(`${f.name} is larger than 2 MB, so I couldn't attach it.`); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const code = String(reader.result || "");
      const att = { id: "att-" + Date.now(), name: f.name, size: f.size, lines: code.split("\n").length, code, type: f.type };
      setMessages((m) => [...m, { id: Date.now(), from: "me", file: att }]);
      if (db && sbUser) {
        cloudUpload(sbUser, f, f.name, f.type, "chat", "upload")
          .then((row) => setMessages((m) => m.map((x) => (x.file && x.file.id === att.id ? { ...x, file: { ...x.file, path: row.path } } : x))))
          .catch((e) => { console.error("Supabase:", e.message); addBot(`${f.name} is here in the chat, but it couldn't be stored in your account.`); });
      }
      setTyping(true);
      setTimeout(() => {
        addBot(`I've got ${att.name}. Press "Check this file" to run the checks, or "Save to dashboard" to keep it there.`);
        setTyping(false);
      }, 600);
    };
    reader.onerror = () => addBot("Sorry, I couldn't read that file. Try a code or text file.");
    reader.readAsText(f);
  }

  async function saveFile(f) {
    if (db && sbUser) {
      try {
        if (f.path) {
          const { error } = await db.from("files").insert({ location: "dashboard", name: f.name, path: f.path, size: f.size, type: f.type || "", origin: "chat" });
          if (error) throw error;
        } else {
          await cloudUpload(sbUser, new Blob([f.code], { type: "text/plain" }), f.name, "text/plain", "dashboard", "chat");
        }
        setSavedIds((s) => ({ ...s, [f.id]: true }));
        addBot(`${f.name} was saved to your dashboard. It shows up under My files.`);
      } catch (e) {
        console.error("Supabase:", e.message);
        addBot(`I couldn't save ${f.name} to your dashboard: ${e.message}`);
      }
      return;
    }
    if (sendToDashboard(f)) {
      setSavedIds((s) => ({ ...s, [f.id]: true }));
      addBot(`${f.name} was sent to your dashboard. It shows up under My files.`);
    } else {
      addBot("I couldn't reach your dashboard. Open this chat box from the dashboard and try again.");
    }
  }

  function send() {
    const text = input.trim();
    if (!text || typing) return;
    setMessages((m) => [...m, { id: Date.now(), from: "me", text }]);
    setInput("");
    setTyping(true);
    setTimeout(() => {
      addBot(getReply(text, file, checks, analysisDone));
      setTyping(false);
    }, 800);
  }

  function onKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  }

  const snapshot = file ? file.code.split("\n").slice(0, SNAPSHOT_LINES) : [];

  return (
    <div className="app">
      <header>
        <h1 className="title">Homework check — AI feedback</h1>
        <p className="subtitle">Your submitted work is checked here. You can ask the AI a question below at any time.</p>
      </header>

      <div className="work">
        {!file ? (
          <div className="empty">
            <strong>No homework submitted yet</strong>
            Once you submit your work, the AI's test results and a snapshot of your code will show up here.
          </div>
        ) : (
          <>
            <div className="filebar">
              <div>
                <span className="name">{file.name}</span>
                <span className="meta">{file.lines} lines · {(file.size / 1024).toFixed(1)} KB</span>
              </div>
              {file.origin === "dashboard" ? (
                <span className="meta">On your dashboard</span>
              ) : (
                <button className="link-btn" onClick={() => saveFile(file)} disabled={!!savedIds[file.id]}>
                  {savedIds[file.id] ? "Saved to dashboard" : "Save to dashboard"}
                </button>
              )}
            </div>

            <div className="results">
              <div className="card">
                <h2>AI test results</h2>
                <ul className="checks">
                  {checks.map((c) => {
                    const cls = c.state === "done" ? (c.pass ? "pass" : "fail") : c.state;
                    return (
                      <li key={c.label} className={cls}>
                        <span className="status">{c.state === "done" ? (c.pass ? "✓" : "✕") : ""}</span>
                        <div>
                          <div className="label">{c.label}</div>
                          <div className="detail">
                            {c.state === "done" ? c.detail : c.state === "running" ? "Checking…" : "Waiting"}
                          </div>
                        </div>
                      </li>
                    );
                  })}
                </ul>
                <div className="score">
                  <span className="detail" style={{ color: "var(--muted)", fontSize: 12 }}>
                    {analysisDone ? "Check complete" : `Checking ${doneCount} of ${checks.length}…`}
                  </span>
                  <span className="big">{passedCount}/{checks.length}</span>
                </div>
                <div className="bar">
                  <div className="fill" style={{ width: `${checks.length ? (doneCount / checks.length) * 100 : 0}%` }} />
                </div>
              </div>

              <div className="code-card">
                <div className="code-head">
                  <span>{file.name}</span>
                  <span>snapshot</span>
                </div>
                <pre className="code">
                  {snapshot.map((line, i) => (
                    <div key={i} className="line">
                      <span className="ln">{i + 1}</span>
                      <span>{line || " "}</span>
                    </div>
                  ))}
                </pre>
                {file.lines > SNAPSHOT_LINES && (
                  <div className="more">… {file.lines - SNAPSHOT_LINES} more lines</div>
                )}
              </div>
            </div>
          </>
        )}
      </div>

      <section className="chat">
        <div className="chat-head">
          <strong>AI chat</strong>
          <span className="pill">
            {file ? `Using ${file.name}` : "No work submitted"}
            {sbUser ? " · synced" : sbUser === null ? " · not signed in" : ""}
          </span>
        </div>
        <div className="messages">
          {messages.map((m) => (
            <div key={m.id} className={`msg ${m.from}`}>
              {m.from === "bot" && <span className="avatar">AI</span>}
              {m.file ? (
                <div className="bubble attach">
                  <span className="fname">📄 {m.file.name}</span>
                  {m.file.fromDash && <span className="fmeta">Sent from your dashboard</span>}
                  {m.file.id.startsWith("row-") && !m.file.fromDash && <span className="fmeta">Submitted homework</span>}
                  <span className="fmeta">{m.file.lines} lines · {(m.file.size / 1024).toFixed(1)} KB</span>
                  <span className="actions">
                    <button className="link-btn" onClick={() => loadSubmission(m.file)}>Check this file</button>
                    {!m.file.fromDash && (
                      <button className="link-btn" onClick={() => saveFile(m.file)} disabled={!!savedIds[m.file.id]}>
                        {savedIds[m.file.id] ? "Saved to dashboard" : "Save to dashboard"}
                      </button>
                    )}
                  </span>
                </div>
              ) : (
                <div className="bubble">{m.text}</div>
              )}
            </div>
          ))}
          {typing && (
            <div className="msg bot">
              <span className="avatar">AI</span>
              <div className="bubble typing"><span></span><span></span><span></span></div>
            </div>
          )}
          <div ref={endRef} />
        </div>
        <div className="composer">
          <label className="clip" title="Attach a file" aria-label="Attach a file">
            📎
            <input
              type="file"
              accept=".py,.js,.jsx,.ts,.java,.c,.cpp,.cs,.html,.css,.txt,.md,.json,.csv"
              onChange={(e) => { attachFile(e.target.files[0]); e.target.value = ""; }}
            />
          </label>
          <textarea
            placeholder="Ask the AI anything…"
            value={input}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={onKeyDown}
          />
          <button className="btn" onClick={send} disabled={!input.trim() || typing}>Send</button>
        </div>
      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
