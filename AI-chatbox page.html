<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homework Check — AI Feedback</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Your styles -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Supabase connection -->
  <script>
    const db = window.supabase.createClient(
      'https://xsfipfsslgdjnelbgypu.supabase.co',
      'sb_publishable_CCwu2bpoYWtXQFZbQU1nHA_5Pgl_5u_'
    );
  </script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

const SNAPSHOT_LINES = 15;
const STORAGE_KEY = "submission";

/* ---------- The AI checks run on the submitted code ---------- */
function buildChecks(code) {
  const lines = code.split("\n");
  const longLines = lines.filter((l) => l.length > 100).length;
  const hasTabs = lines.some((l) => /^\t/.test(l));
  const hasSpaces = lines.some((l) => /^ {2,}/.test(l));
  const todos = (code.match(/\b(TODO|FIXME)\b/g) || []).length;
  const fnCount = (code.match(/\bdef\s+\w+|\bfunction\s+\w+|\w+\s*=\s*\(?[\w\s,]*\)?\s*=>|\b(public|private|static|void|int|String)\s+\w+\s*\(/g) || []).length;
  const commentCount = (code.match(/(^|\s)(#|\/\/|\/\*)/gm) || []).length;
  const returns = (code.match(/\breturn\b/g) || []).length;

  return [
    {
      label: "File received and readable",
      pass: code.trim().length > 0,
      detail: code.trim() ? `${lines.length} lines found` : "The file is empty",
    },
    {
      label: "Defines at least one function",
      pass: fnCount > 0,
      detail: fnCount ? `${fnCount} function${fnCount > 1 ? "s" : ""} found` : "No functions detected",
    },
    {
      label: "Functions return results",
      pass: returns > 0,
      detail: returns ? `${returns} return statement${returns > 1 ? "s" : ""}` : "No return statements found",
    },
    {
      label: "Code includes comments",
      pass: commentCount > 0,
      detail: commentCount ? `${commentCount} comment${commentCount > 1 ? "s" : ""} found` : "Add comments to explain your logic",
    },
    {
      label: "No unfinished TODO / FIXME notes",
      pass: todos === 0,
      detail: todos ? `${todos} left in the file` : "Looks finished",
    },
    {
      label: "Consistent indentation",
      pass: !(hasTabs && hasSpaces),
      detail: hasTabs && hasSpaces ? "Mix of tabs and spaces" : "Indentation is consistent",
    },
    {
      label: "Lines are a readable length",
      pass: longLines === 0,
      detail: longLines ? `${longLines} line${longLines > 1 ? "s" : ""} over 100 characters` : "All lines under 100 characters",
    },
  ];
}

/* ---------- Chat replies (replace with a real AI call later) ---------- */
function getReply(text, file, checks, analysisDone) {
  const t = text.toLowerCase();
  const failed = checks.filter((c) => c.pass === false);

  if (file && !analysisDone) return "I'm still checking your file — give me a second and ask again.";

  if (file && /(result|score|grade|pass|fail|how did|check)/.test(t)) {
    const passed = checks.length - failed.length;
    if (!failed.length) return `Your file ${file.name} passed all ${checks.length} checks. Nice work!`;
    return `${file.name} passed ${passed} of ${checks.length} checks.\n\nTo fix:\n` +
      failed.map((c) => `• ${c.label} — ${c.detail}`).join("\n");
  }
  if (file && /(file|code|submit|upload)/.test(t)) {
    return `I can see ${file.name} (${file.lines} lines). Ask me about your results, or about any part of your code.`;
  }
  if (/\b(hi|hello|hey)\b/.test(t)) {
    return file
      ? `Hi! I've looked at ${file.name}. Want me to go over your results?`
      : "Hi! You can ask me anything about your homework, and once you submit your work I'll check it here.";
  }
  if (t.includes("?")) return "Good question — can you tell me a bit more about what you're thinking?";
  return file
    ? "Got it. Ask me about your results, or tell me which part of your code you'd like help with."
    : "Thanks! Once you submit your work I can check it — until then, keep asking questions here.";
}

function App() {
  const [file, setFile] = useState(null); // { name, size, lines, code }
  const [checks, setChecks] = useState([]); // each: {label, detail, pass, state}
  const [messages, setMessages] = useState([
    { id: 1, from: "bot", text: "Hi! Ask me anything about your homework. Once you submit your work, I'll check it here too." },
  ]);
  const [input, setInput] = useState("");
  const [typing, setTyping] = useState(false);
  const [user, setUser] = useState(null); // the student signed in on your signup page
  const endRef = useRef(null);
  const timers = useRef([]);

  const analysisDone = checks.length > 0 && checks.every((c) => c.state === "done");
  const passedCount = checks.filter((c) => c.state === "done" && c.pass).length;
  const doneCount = checks.filter((c) => c.state === "done").length;

  useEffect(() => {
    endRef.current?.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }, [messages, typing]);

  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  // Picks up the login from your signup page (same Supabase project, same site)
  useEffect(() => {
    db.auth.getSession().then(({ data }) => setUser(data.session?.user ?? null));
    const { data } = db.auth.onAuthStateChange((_event, s) => setUser(s?.user ?? null));
    return () => data.subscription.unsubscribe();
  }, []);

  function addBot(text) {
    setMessages((m) => [...m, { id: Date.now() + Math.random(), from: "bot", text }]);
  }

  // Loads homework sent from your other page.
  function loadSubmission(sub) {
    if (!sub || typeof sub.code !== "string") return;
    const info = {
      name: sub.name || "submission.txt",
      size: sub.size ?? new Blob([sub.code]).size,
      lines: sub.code.split("\n").length,
      code: sub.code,
    };
    setFile(info);
    runChecks(info);
  }

  useEffect(() => {
    // 1) Your other page can call: window.loadSubmission({ name, code })
    window.loadSubmission = loadSubmission;

    // 2) Or save it before opening this page:
    //    localStorage.setItem("submission", JSON.stringify({ name, code }))
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) loadSubmission(JSON.parse(saved));
    } catch (e) {}

    // Picks up a new submission saved from another tab
    function onStorage(e) {
      if (e.key !== STORAGE_KEY || !e.newValue) return;
      try { loadSubmission(JSON.parse(e.newValue)); } catch (err) {}
    }
    window.addEventListener("storage", onStorage);
    return () => window.removeEventListener("storage", onStorage);
  }, []);

  // Saves the submission and its results to the Supabase "submissions" table
  async function saveSubmission(info, results) {
    const { data } = await db.auth.getSession();
    const u = data.session?.user;
    if (!u) {
      addBot("Your work was checked, but it wasn't saved because you're not signed in.");
      return;
    }

    // Skip saving if this exact file was already saved (e.g. after a page refresh)
    const key = "saved:" + u.id;
    const fp = info.name + ":" + info.code.length + ":" + info.code.slice(0, 200);
    if (localStorage.getItem(key) === fp) return;

    const { error } = await db.from("submissions").insert({
      user_id: u.id,
      file_name: info.name,
      code: info.code,
      checks: results.map(({ label, pass, detail }) => ({ label, pass, detail })),
      passed: results.filter((r) => r.pass).length,
      total: results.length,
    });
    if (error) {
      console.error("Supabase:", error.message);
      addBot("Your work was checked, but it couldn't be saved. Try refreshing the page.");
      return;
    }
    localStorage.setItem(key, fp);
  }

  function runChecks(info) {
    timers.current.forEach(clearTimeout);
    timers.current = [];
    const results = buildChecks(info.code);
    setChecks(results.map((r) => ({ ...r, state: "pending" })));
    addBot(`Got ${info.name}! Checking it now…`);

    results.forEach((_, i) => {
      timers.current.push(setTimeout(() => {
        setChecks((cs) => cs.map((c, j) => (j === i ? { ...c, state: "running" } : c)));
      }, i * 700 + 200));
      timers.current.push(setTimeout(() => {
        setChecks((cs) => cs.map((c, j) => (j === i ? { ...c, state: "done" } : c)));
      }, i * 700 + 750));
    });

    timers.current.push(setTimeout(() => {
      const failed = results.filter((r) => !r.pass);
      addBot(failed.length
        ? `Done! ${info.name} passed ${results.length - failed.length} of ${results.length} checks. Ask me "what failed?" and I'll explain.`
        : `Done! ${info.name} passed all ${results.length} checks. Great job!`);
      saveSubmission(info, results);
    }, results.length * 700 + 900));
  }

  function send() {
    const text = input.trim();
    if (!text || typing) return;
    setMessages((m) => [...m, { id: Date.now(), from: "me", text }]);
    setInput("");
    setTyping(true);

    // Save the student's message to the Supabase "messages" table
    db.from("messages").insert({ text }).then(({ error }) => {
      if (error) console.error("Supabase:", error.message);
    });

    setTimeout(() => {
      addBot(getReply(text, file, checks, analysisDone));
      setTyping(false);
    }, 800);
  }

  function onKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  }

  const snapshot = file ? file.code.split("\n").slice(0, SNAPSHOT_LINES) : [];

  return (
    <div className="app">
      <header>
        <h1 className="title">Homework check — AI feedback</h1>
        <p className="subtitle">Your submitted work is checked here. You can ask the AI a question below at any time.</p>
      </header>

      <div className="work">
        {!file ? (
          <div className="empty">
            <strong>No homework submitted yet</strong>
            Once you submit your work, the AI's test results and a snapshot of your code will show up here.
          </div>
        ) : (
          <>
            <div className="filebar">
              <div>
                <span className="name">{file.name}</span>
                <span className="meta">{file.lines} lines · {(file.size / 1024).toFixed(1)} KB</span>
              </div>
            </div>

            <div className="results">
              <div className="card">
                <h2>AI test results</h2>
                <ul className="checks">
                  {checks.map((c) => {
                    const cls = c.state === "done" ? (c.pass ? "pass" : "fail") : c.state;
                    return (
                      <li key={c.label} className={cls}>
                        <span className="status">{c.state === "done" ? (c.pass ? "✓" : "✕") : ""}</span>
                        <div>
                          <div className="label">{c.label}</div>
                          <div className="detail">
                            {c.state === "done" ? c.detail : c.state === "running" ? "Checking…" : "Waiting"}
                          </div>
                        </div>
                      </li>
                    );
                  })}
                </ul>
                <div className="score">
                  <span className="detail" style={{ color: "var(--muted)", fontSize: 12 }}>
                    {analysisDone ? "Check complete" : `Checking ${doneCount} of ${checks.length}…`}
                  </span>
                  <span className="big">{passedCount}/{checks.length}</span>
                </div>
                <div className="bar">
                  <div className="fill" style={{ width: `${checks.length ? (doneCount / checks.length) * 100 : 0}%` }} />
                </div>
              </div>

              <div className="code-card">
                <div className="code-head">
                  <span>{file.name}</span>
                  <span>snapshot</span>
                </div>
                <pre className="code">
                  {snapshot.map((line, i) => (
                    <div key={i} className="line">
                      <span className="ln">{i + 1}</span>
                      <span>{line || " "}</span>
                    </div>
                  ))}
                </pre>
                {file.lines > SNAPSHOT_LINES && (
                  <div className="more">… {file.lines - SNAPSHOT_LINES} more lines</div>
                )}
              </div>
            </div>
          </>
        )}
      </div>

      <section className="chat">
        <div className="chat-head">
          <strong>AI chat</strong>
          <span className="pill">{file ? `Using ${file.name}` : "No work submitted"}</span>
        </div>
        <div className="messages">
          {messages.map((m) => (
            <div key={m.id} className={`msg ${m.from}`}>
              {m.from === "bot" && <span className="avatar">AI</span>}
              <div className="bubble">{m.text}</div>
            </div>
          ))}
          {typing && (
            <div className="msg bot">
              <span className="avatar">AI</span>
              <div className="bubble typing"><span></span><span></span><span></span></div>
            </div>
          )}
          <div ref={endRef} />
        </div>
        <div className="composer">
          <textarea
            placeholder="Ask the AI anything…"
            value={input}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={onKeyDown}
          />
          <button className="btn" onClick={send} disabled={!input.trim() || typing}>Send</button>
        </div>
      </section>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
