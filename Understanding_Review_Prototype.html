<script>

const TESTS={

  c2:c=>/%\s*2\s*==\s*0/.test(c),

const HINTS={
  c1:['Check the name and the parameters of your function against the assignment.','The function must be named exactly sum_even and take one list argument.','Start with a line that begins with def and names the function and its one parameter.'],
  c2:['Test your function with a list that has both odd and even numbers. Which ones get added?','Look at the condition inside your loop. Which remainder identifies an even number?','The remainder of an even number divided by 2 should be compared with zero.'],
  c3:['Does your function give a value back to the caller?','Printing a value is not the same as returning it.','Add a return statement at the end that gives back the running total.'],
  c4:['How does your function look at every item in the list?','You need to visit each number once. Python has two common loop forms.','Use a for loop over the list, or a sum over a comprehension.'],
  c5:['What should the function give back for an empty list?','Think about what value a running total has before any number is added.','Make sure the total has a starting value of zero.']
};
const BANK={
 A:{name:'Loop control',
  primary:{q:'Walk through what happens inside your loop when nums is [2, 3, 4]. What is the running total after each pass?',
    rubric:[{label:'Names the starting value of the total',re:/zero|\b0\b|initial|start/i},{label:'Explains that odd items are skipped',re:/odd|skip|only add|not added|ignore/i},{label:'Reaches the correct total (6)',re:/\b6\b|six/i}],

 B:{name:'Modulo and conditions',

    checks:[
      {id:'c1',label:'Defines sum_even(nums)',req:'Define a function named sum_even that takes a list',mandatory:true,diag:"NameError: name 'sum_even' is not defined"},

      {id:'c3',label:'Returns a value',req:'Return the total to the caller',mandatory:true,diag:'test_returns: sum_even([2]) returned None'},

  const GOOD='def sum_even(nums):\n    total = 0\n    for n in nums:\n        if n % 2 == 0:\n            total += n\n    return total\n';
  const BAD='def sum_even(nums):\n    total = 0\n    for n in nums:\n        if n % 2 == 1:\n            total += n\n    return total\n';
  const users=[
    {id:'u1',name:'Ava Morales',email:'ava@school.edu',role:'student',pseud:'stu_a91f',active:true},
    {id:'u2',name:'Ben Okafor',email:'ben@school.edu',role:'student',pseud:'stu_b27c',active:true},

    {id:'u4',name:'Dev Patel',email:'dev@school.edu',role:'student',pseud:'stu_d08e',active:true},
    {id:'i1',name:'Dr. Lena Rivera',email:'rivera@school.edu',role:'instructor',pseud:'',active:true},
    {id:'a1',name:'Sam Whitfield',email:'admin@school.edu',role:'administrator',pseud:'',active:true}];
  const ev=(asg,okIds,code)=>{const checks=asg.checks.map(c=>({id:c.id,ok:okIds.includes(c.id)}));return{checks,passed:checks.filter(c=>c.ok).length,total:checks.length,suite:'s1.2',diag:checks.filter(c=>!c.ok).map(c=>asg.checks.find(x=>x.id===c.id).diag||''),at:ago(0)}};

    routing:[{at:ago(9000),t:'Evaluation complete: 3 of 3 checks. Decision PASS.'},{at:ago(8990),t:'Routed to Path A: Understanding Review.'},{at:ago(8980),t:'Understanding Review finished: sufficient evidence.'}],
    session:{order:['A'],turns:[{c:'A',kind:'primary',q:'Explain what your function returns and why.',a:'It returns the greeting string so the caller can print it.',score:3,pts:[true,true,true],at:ago(8985),generic:true}],outcome:'sufficient',insufficient:[],model:MODEL},actions:[]});
  // Ben: complete

    routing:[{at:ago(300),t:'Evaluation complete: 5 of 5 checks. Decision PASS.'},{at:ago(299),t:'Routed to Path A: Understanding Review.'},{at:ago(280),t:'Understanding Review finished: sufficient evidence.'}],
    session:{order:['A','B'],turns:[turn('A','primary',BANK.A.primary.strong,3,[true,true,true],295),turn('B','primary','The % gives the remainder, and a remainder of 0 means even. With == 1 you would be adding the odd ones.',2,[true,true,false],285)],outcome:'sufficient',insufficient:[],model:MODEL},actions:[]});
  // Chloe: correction
  threads.push({id:'T3',studentId:'u3',asg:'A2',status:'correction',hold:null,hints:1,released:false,requested:false,
    versions:[{n:1,filename:'sum_even.py',code:BAD,at:ago(90),eval:ev(ASG2,['c1','c3','c4','c5']),decision:'FAIL'}],

    session:{order:['A','B'],turns:[turn('A','primary',BANK.A.primary.weak,0,[false,false,false],195),turn('A','retry',BANK.A.retry.weak,0,[false,false,false],188),turn('B','primary',BANK.B.primary.strong,3,[true,true,true],180)],outcome:'referred',insufficient:['A'],model:MODEL},actions:[]});
  return{users,asgs:[ASG1,ASG2],threads,services:{evaluator:true,ai:true,pathB:true},audit:[
    {at:ago(300),who:'stu_b27c',what:'Submitted sum_even.py (version 1)'},{at:ago(200),who:'stu_d08e',what:'Submitted sum_even.py (version 1)'},{at:ago(90),who:'stu_c55d',what:'Submitted sum_even.py (version 1)'}],

const asgOf=id=>S.asgs.find(a=>a.id===id);

function evaluate(code){
  const asg=A2();
  const checks=asg.checks.map(c=>({id:c.id,ok:!!TESTS[c.id](code)}));
  return{checks,passed:checks.filter(c=>c.ok).length,total:checks.length,suite:'s1.2',diag:checks.filter(c=>!c.ok).map(c=>asg.checks.find(x=>x.id===c.id).diag),at:new Date()};

/* WS2 router v0.2 (JS port of Router/router.py, same rules, same 11 test cases).
   The AI never decides correctness: only the instructor's checks do. */
function routeDecision(o){
  const w=[];
  if(!o.uploadValid) return ['REJECTED','INVALID_UPLOAD',w];
  if(o.errorStatus==='CRASH'||o.errorStatus==='SANDBOX_ERROR') return ['MANUAL_REVIEW','EVALUATOR_ERROR',w];
  if(o.errorStatus==='PROHIBITED_ACTION') return ['MANUAL_REVIEW','PROHIBITED_ACTION',w];
  if(!o.testSuiteOk||!o.testsTotal) return ['MANUAL_REVIEW','TEST_SUITE_MISSING',w];
  if(o.compileStatus!=='SUCCESS') return ['FAIL','SYNTAX_ERROR',w];
  if(o.errorStatus==='TIMEOUT') return ['FAIL','TIMEOUT',w];
  if(o.errorStatus==='MEMORY_LIMIT') return ['FAIL','MEMORY_LIMIT',w];
  if(o.errorStatus==='RUNTIME_EXCEPTION') return ['FAIL','RUNTIME_EXCEPTION',w];
  if(o.testsPassed<o.threshold) return ['FAIL','WRONG_OUTPUT',w];
  if((o.commentLines||0)<(o.minComments||0)) w.push('MISSING_COMMENTS');
  return ['PASS',null,w];
}
function route(ev,asg){
  if(!ev) return{d:'MANUAL REVIEW',why:'No evaluation evidence',code:'EVALUATOR_ERROR'};
  const mand=asg.checks.filter(c=>c.mandatory);
  const passedMand=ev.checks.filter(c=>c.ok&&asg.checks.find(x=>x.id===c.id).mandatory).length;
  const r=routeDecision({uploadValid:true,compileStatus:'SUCCESS',errorStatus:null,
    testsPassed:passedMand,testsTotal:mand.length,threshold:mand.length,testSuiteOk:true});
  const unmet=mand.length-passedMand;
  const why=r[0]==='PASS'?'All mandatory checks met'
    :r[0]==='FAIL'?unmet+' mandatory check'+(unmet>1?'s':'')+' not met'
    :'Needs a person to check ('+r[1]+')';
  return{d:r[0].replace('_',' '),why,code:r[1]};
}
function addRoute(th,t){th.routing.push({at:new Date(),t});}
function validateUpload(name,code){
  if(!/\.py$/i.test(name.trim())) return 'This file type is not accepted. Upload a Python file that ends in .py.';
  if(code.length>20000) return 'The file is larger than 20 KB. Upload a smaller file.';
  if(code.trim().length<10) return 'The file is empty or too short to evaluate. Upload your completed work.';
  if(/\bimport\s+(os|subprocess|socket)\b/.test(code)) return 'The file imports a module that is not allowed for this assignment. Remove it and upload again.';
  return null;
}

  UI.err=null;
  let th=threadFor(u.id,'A2');
  if(!th){th={id:'T'+(S.threads.length+1),studentId:u.id,asg:'A2',status:'manual',hold:null,hints:0,released:false,requested:false,versions:[],routing:[],session:null,actions:[]};S.threads.push(th);}
  const prevStatus=th.status;
  const v={n:th.versions.length+1,filename:UI.fname.trim(),code:UI.code,at:new Date(),eval:null,decision:null};
  th.versions.push(v);
  log(u.pseud,'Submitted '+v.filename+' (version '+v.n+')');
  if(!S.services.evaluator){
    th.status='manual';th.hold='The evaluator was unavailable. Your submission is saved and has not been marked incorrect.';
    addRoute(th,'Evaluation unavailable. Record preserved. Status: MANUAL REVIEW.');
    UI.view='session';toast('Submission saved. Evaluation is unavailable right now.');render();return;
  }
  v.eval=evaluate(v.code);
  applyRouting(th,v,prevStatus==='correction');
  UI.view=th.status==='correction'?'session':(th.status==='review'?'session':'results');
  render();
}
function applyRouting(th,v,wasRevision){
  const asg=A2(),r=route(v.eval,asg);
  v.decision=r.d;
  addRoute(th,'Evaluation complete: '+v.eval.passed+' of '+v.eval.total+' checks. Decision '+r.d+' ('+r.why+'). Router v0.2.');
  if(r.d==='PASS'){
    if(!S.services.ai){th.status='manual';th.hold='The AI service was unavailable, so the Understanding Review could not start. Nothing was marked incorrect.';addRoute(th,'Path A could not start (AI service unavailable). Status: MANUAL REVIEW.');return;}
    addRoute(th,wasRevision?'Revised submission passed. Proceeding to Path A: Understanding Review.':'Routed to Path A: Understanding Review.');
    startSession(th);
  }else{
    th.status='correction';th.hold=null;
    addRoute(th,'Routed to Path B: Guided Correction.');
  }
}
function startSession(th){
  th.status='review';th.hold=null;
  th.session={order:['A','B'],turns:[],outcome:null,insufficient:[],model:MODEL,startedAt:new Date()};
  nextTurn(th,'A','primary');
}
function nextTurn(th,c,kind){th.session.turns.push({c,kind,q:BANK[c][kind].q,a:null,score:null,pts:null,at:new Date()});}
function curTurn(th){const s=th.session;if(!s)return null;const t=s.turns[s.turns.length-1];return t&&t.a===null?t:null;}
function pendingScore(th){const s=th.session;if(!s)return null;const t=s.turns[s.turns.length-1];return t&&t.a!==null&&t.score===null?t:null;}
function submitAnswer(){
  const th=threadFor(UI.user.id,'A2'),t=curTurn(th),text=UI.ans.trim();
  if(!t)return; if(text.length<5){toast('Write a short answer first.');return;}
  t.a=text;UI.ans='';
  log(UI.user.pseud,'Answered '+BANK[t.c].name+' ('+t.kind+')');
  scoreTurn(th,t);render();
}
function scoreTurn(th,t){
  if(!S.services.ai){th.status='manual';th.hold='AI scoring is unavailable. Your answer is saved and has not been scored as incorrect.';addRoute(th,'Scoring unavailable. Answer preserved. Status: MANUAL REVIEW.');return;}
  const R=BANK[t.c][t.kind].rubric;
  t.pts=R.map(r=>r.re.test(t.a));t.score=t.pts.filter(Boolean).length;t.scoredAt=new Date();
  th.status='review';th.hold=null;
  const thr=A2().config.threshold,s=th.session;
  if(t.score>=thr){advance(th,t);}
  else if(t.kind==='primary'){nextTurn(th,t.c,'retry');}
  else{s.insufficient.push(t.c);advance(th,t);}
}
function advance(th,t){
  const s=th.session,i=s.order.indexOf(t.c);
  if(i<s.order.length-1){nextTurn(th,s.order[i+1],'primary');return;}
  if(s.insufficient.length){
    s.outcome='referred';th.status='referred';th.hold='Understanding evidence was not sufficient on "'+s.insufficient.map(c=>BANK[c].name).join('", "')+'" after the retry.';
    addRoute(th,'Referred to instructor: limits reached without sufficient evidence.');
  }else{
    s.outcome='sufficient';th.status='complete';th.hold=null;
    addRoute(th,'Understanding Review finished: sufficient evidence.');
  }
}
function retryHold(id){
  const th=S.threads.find(t=>t.id===id),v=lastV(th);
  if(th.session&&pendingScore(th)){if(!S.services.ai){toast('AI service is still unavailable.');return;}scoreTurn(th,pendingScore(th));log('system','Retried scoring for '+th.id);render();return;}
  if(!v.eval){if(!S.services.evaluator){toast('Evaluator is still unavailable.');return;}v.eval=evaluate(v.code);applyRouting(th,v,false);log('system','Retried evaluation for '+th.id);render();return;}
  if(v.decision==='PASS'&&!th.session){if(!S.services.ai){toast('AI service is still unavailable.');return;}addRoute(th,'Retry succeeded. Routed to Path A: Understanding Review.');startSession(th);log('system','Started review for '+th.id);render();return;}
  toast('Nothing to retry.');
}
function nextHint(){
  const th=threadFor(UI.user.id,'A2');if(th.hints>=3)return;
  th.hints++;log(UI.user.pseud,'Requested hint level '+th.hints);render();
}
function firstUnmet(th){const v=lastV(th);if(!v.eval)return null;const asg=A2();const c=v.eval.checks.find(c=>!c.ok&&asg.checks.find(x=>x.id===c.id).mandatory);return c?c.id:null;}
function points(th){const s=th.session;if(!s)return{got:0,max:0};let got=0,max=0;s.turns.forEach(t=>{if(t.score!=null){got+=t.score;max+=3;}});return{got,max};}
function pathLabel(th){return th.status==='correction'?'Guided Correction':(th.status==='manual'?'Pending':'Understanding Review');}
function checksPill(th){
  const v=lastV(th);
  if(th.actions.some(a=>a.type==='checks'))return pill('ok','passed (instructor)');
  if(!v.eval)return pill('warn','not completed');
  return v.decision==='PASS'?pill('ok','passed'):pill('bad','not yet passed');
}
function underPill(th){
  const o=th.actions.some(a=>a.type==='sufficient')?' (instructor)':'';
  return({correction:pill('mute','not started'),review:pill('info','in progress'),complete:pill('ok','sufficient evidence'+o),referred:pill('warn','with instructor'),manual:pill('warn','on hold')})[th.status];
}
function feedbackVisible(th,t){
  const r=asgOf(th.asg).config.release;
  if(r==='immediate')return t.score!=null;
  if(r==='after_complete')return !!th.session.outcome;
  return !!th.released;
}

  h+='<div class="card"><h3>Needs attention</h3>';
  if(!attn.length)h+='<p class="muted">Nothing needs review right now.</p>';
  else h+='<div class="scroll"><table><thead><tr><th>Student</th><th>Reason</th><th></th></tr></thead><tbody>'+attn.map(t=>'<tr class="click" onclick="openRec(\''+t.id+'\')"><td>'+esc(stuName(t))+'</td><td>'+esc(t.requested&&t.status!=='referred'&&t.status!=='manual'?'Student requested review':(t.hold||'Review requested'))+'</td><td>'+pill('warn','Open')+'</td></tr>').join('')+'</tbody></table></div>';
  h+='</div><div class="card"><h3>Roster</h3>'+rosterTable()+'</div>';
  return h;
}
function rosterTable(){
  const asg=A2(),done=S.threads.filter(t=>t.asg==='A2');
  const rows=S.users.filter(u=>u.role==='student').map(u=>{
    const t=done.find(x=>x.studentId===u.id);
    return t?'<tr class="click" onclick="openRec(\''+t.id+'\')"><td>'+esc(u.name)+'</td><td>'+checksPill(t)+'</td><td>'+underPill(t)+'</td><td class="mono">'+(t.session&&points(t).max?points(t).got+'/'+points(t).max:'')+'</td></tr>'
      :'<tr><td>'+esc(u.name)+'</td><td>'+pill('mute','no submission')+'</td><td></td><td></td></tr>';}).join('');
  return '<div class="scroll"><table><thead><tr><th>Student</th><th>Assignment checks</th><th>Understanding review</th><th>Points</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function openRec(id){UI.view='records';UI.rec=id;render();}
function vRecords(){
  if(UI.rec)return vRecDetail(S.threads.find(t=>t.id===UI.rec));
  let h='<div class="head"><div><h1>Records</h1><p class="muted">Select a row for the full record.</p></div></div>';
  h+='<div class="card"><div class="scroll"><table><thead><tr><th>Student</th><th>Assignment</th><th>Versions</th><th>Checks</th><th>Understanding</th><th>Flags</th></tr></thead><tbody>'+
  S.threads.map(t=>'<tr class="click" onclick="openRec(\''+t.id+'\')"><td>'+esc(stuName(t))+'<div class="mono muted">'+esc(userOf(t.studentId).pseud)+'</div></td><td>'+esc(asgOf(t.asg).title)+'</td><td>'+t.versions.length+'</td><td>'+checksPill(t)+'</td><td>'+underPill(t)+'</td><td>'+(needsAttention(t)?pill('warn','attention'):'')+(t.actions.length?' '+pill('info',t.actions.length+' action'+(t.actions.length>1?'s':'')):'')+'</td></tr>').join('')+'</tbody></table></div></div>';
  return h;
}
function vRecDetail(th){
  const asg=asgOf(th.asg),u=userOf(th.studentId),pts=points(th);
  let h='<div class="head"><div><button class="btn sec sm" onclick="openRec(null)">Back to records</button><h1 style="margin-top:8px">'+esc(u.name)+'</h1><p class="muted"><span class="mono">'+esc(u.pseud)+'</span> · '+esc(asg.title)+' · assignment version 2</p></div><div class="row">'+checksPill(th)+underPill(th)+'</div></div>';
  if(th.hold)h+='<div class="note warn">'+esc(th.hold)+'</div>';
  if(th.requested)h+='<div class="note">The student requested instructor review.</div>';
  // versions
  h+='<div class="card"><h3>Submission versions and evaluation</h3>';
  th.versions.forEach(v=>{
    h+='<div class="turn" style="border-top:0;margin-top:0"><div class="row"><b>Version '+v.n+'</b><span class="mono muted">'+esc(v.filename)+' · '+fmt(v.at)+'</span>'+(v.decision?pill(v.decision==='PASS'?'ok':'bad',v.decision):pill('warn','no evaluation'))+'</div><pre>'+esc(v.code)+'</pre>';
    if(v.eval){
      h+='<div class="scroll"><table><thead><tr><th>Check</th><th>Mandatory</th><th>Result</th><th>Sanitized diagnostic</th></tr></thead><tbody>'+
      v.eval.checks.map(c=>{const d=asg.checks.find(x=>x.id===c.id);return '<tr><td>'+esc(d.label)+'</td><td>'+(d.mandatory?'yes':'no')+'</td><td>'+(c.ok?pill('ok','pass'):pill('bad','fail'))+'</td><td class="mono">'+(c.ok?'':esc(d.diag||''))+'</td></tr>';}).join('')+'</tbody></table></div><div class="muted mono">'+v.eval.passed+'/'+v.eval.total+' checks · test suite '+esc(v.eval.suite)+'</div>';
    }else h+='<div class="muted">Evaluation did not complete. Record preserved.</div>';
    h+='</div>';
  });
  h+='</div>';
  // routing
  h+='<div class="card"><h3>Routing history</h3><ul class="tl">'+th.routing.map(r=>'<li><div>'+esc(r.t)+'</div><div class="t">'+fmt(r.at)+'</div></li>').join('')+'</ul></div>';
  // session
  if(th.session){
    h+='<div class="card"><h3>Understanding Review record</h3><dl class="kv"><dt>Outcome</dt><dd>'+(th.session.outcome?esc(th.session.outcome):'in progress')+'</dd><dt>Points</dt><dd class="mono">'+pts.got+' of '+pts.max+'</dd><dt>Model and prompt</dt><dd class="mono">'+esc(th.session.model)+'</dd><dt>Sufficiency threshold</dt><dd>'+asg.config.threshold+' of 3 per question</dd></dl>';
    th.session.turns.forEach(t=>{
      h+='<div class="turn"><div class="muted">'+(t.generic?'Understanding':esc(BANK[t.c].name))+' · '+(t.kind==='retry'?'Retry (different question)':'First question')+' · asked '+fmt(t.at)+'</div><div class="q" style="font-size:.95rem">'+esc(t.q)+'</div>'+
      (t.a!==null?'<div><span class="muted">Response:</span> '+esc(t.a)+'</div>':'<div class="muted">Awaiting response.</div>');
      if(t.score!=null){
        h+='<div class="row" style="margin-top:4px"><b class="mono">'+t.score+' / 3</b>'+(t.score>=asg.config.threshold?pill('ok','sufficient'):pill('warn','insufficient'))+'</div>';
        if(!t.generic)h+='<div>'+BANK[t.c][t.kind].rubric.map((r,i)=>'<div>'+(t.pts[i]?pill('ok','covered'):pill('warn','missing'))+' '+esc(r.label)+'</div>').join('')+'</div>';
      }
      h+='</div>';
    });
    h+='<div class="note" style="margin-top:12px">Questions are scored against a rubric. This record is evidence of understanding, not an AI-authorship finding.</div></div>';
  }
  // actions
  h+='<div class="card"><h3>Instructor actions</h3>';
  if(!th.actions.length)h+='<p class="muted">No comments or overrides yet.</p>';
  th.actions.forEach(a=>{h+='<div class="turn"><div class="row">'+pill(a.type==='comment'?'mute':'info',a.label)+'<span class="muted">'+fmt(a.at)+' · '+esc(a.by)+'</span></div><div>'+esc(a.text)+'</div>'+(a.original?'<div class="muted">Original result kept: '+esc(a.original)+'</div>':'')+'</div>';});
  h+='<label for="atext">Comment or reason</label><textarea id="atext" rows="3" style="font-family:var(--font-body)" placeholder="Required for any override."></textarea>';
  h+='<div class="row" style="margin-top:8px"><button class="btn sec sm" onclick="instrAction(\''+th.id+'\',\'comment\')">Add comment</button>';
  if(th.status==='referred'||th.status==='review')h+='<button class="btn sm" onclick="instrAction(\''+th.id+'\',\'sufficient\')">Override: accept understanding evidence</button>';
  if(th.status==='correction'||th.status==='manual')h+='<button class="btn sm" onclick="instrAction(\''+th.id+'\',\'checks\')">Override: pass checks and start review</button>';
  if(th.status==='manual')h+='<button class="btn sec sm" onclick="retryHold(\''+th.id+'\')">Retry automatic step</button>';
  if(th.session&&!th.released)h+='<button class="btn sec sm" onclick="releaseFb(\''+th.id+'\')">Release feedback to student</button>';
  h+='</div></div>';
  return h;
}
function instrAction(id,type){
  const th=S.threads.find(t=>t.id===id),text=(document.getElementById('atext').value||'').trim();
  if(!text){toast('Add a comment or reason first.');return;}
  const orig=checksPlain(th)+'; understanding '+underPlain(th);
  const rec={at:new Date(),by:UI.user.name,type,text};
  if(type==='comment'){rec.label='Comment';}
  if(type==='sufficient'){rec.label='Override: understanding evidence accepted';rec.original=orig;th.status='complete';th.hold=null;if(th.session&&!th.session.outcome)th.session.outcome='sufficient';addRoute(th,'Instructor override: understanding evidence accepted.');}
  if(type==='checks'){
    if(!S.services.ai){toast('AI service is unavailable, so the review cannot start yet.');return;}
    rec.label='Override: checks passed manually';rec.original=orig;addRoute(th,'Instructor override: checks passed manually. Routed to Path A.');startSession(th);
  }
  th.actions.push(rec);log(UI.user.name,'Instructor action on '+th.id+': '+rec.label);render();
}
const checksPlain=th=>{const v=lastV(th);return v.eval?'checks '+v.decision+' ('+v.eval.passed+'/'+v.eval.total+')':'checks not completed';};
const underPlain=th=>th.status==='referred'?'referred ('+points(th).got+'/'+points(th).max+' points)':th.status;
function releaseFb(id){const th=S.threads.find(t=>t.id===id);th.released=true;log(UI.user.name,'Released feedback for '+th.id);toast('Feedback released.');render();}
function vSetup(){
  const asg=A2();const d=UI.setupDraft||(UI.setupDraft={m:Object.fromEntries(asg.checks.map(c=>[c.id,c.mandatory])),threshold:asg.config.threshold,release:asg.config.release});
  let h='<div class="head"><div><h1>Assignment Setup</h1><p class="muted">'+esc(asg.title)+'</p></div></div>';
  h+='<div class="card"><h3>Assignment</h3><p>'+esc(asg.text)+'</p><div class="muted">Learning outcomes: '+asg.outcomes.map(esc).join('; ')+'</div></div>';
  h+='<div class="card"><h3>Routing rule: mandatory checks</h3><p class="muted">The student enters Understanding Review only when every mandatory check passes.</p>'+
   asg.checks.map(c=>'<label style="display:flex;gap:8px;font-weight:500;margin:6px 0"><input type="checkbox" '+(d.m[c.id]?'checked':'')+' onchange="UI.setupDraft.m[\''+c.id+'\']=this.checked"> '+esc(c.label)+'</label>').join('')+'</div>';
  h+='<div class="card"><h3>Understanding Review limits</h3><dl class="kv"><dt>Questions per idea</dt><dd>1 first question + 1 different retry</dd><dt>Ideas covered</dt><dd>Loop control, Modulo and conditions</dd><dt>Maximum questions</dt><dd>4</dd><dt>When limits are reached</dt><dd>Refer to instructor</dd></dl>'+
   '<label for="thr">Score needed per question (out of 3)</label><select id="thr" onchange="UI.setupDraft.threshold=+this.value">'+[1,2,3].map(n=>'<option '+(d.threshold===n?'selected':'')+'>'+n+'</option>').join('')+'</select>'+
   '<label for="rel">Feedback release</label><select id="rel" onchange="UI.setupDraft.release=this.value"><option value="immediate" '+(d.release==='immediate'?'selected':'')+'>After each question</option><option value="after_complete" '+(d.release==='after_complete'?'selected':'')+'>After the review ends</option><option value="manual" '+(d.release==='manual'?'selected':'')+'>When I release it</option></select></div>';
  h+='<button class="btn" onclick="saveSetup()">Save settings</button>';
  return h;
}
function saveSetup(){
  const asg=A2(),d=UI.setupDraft;
  if(!Object.values(d.m).some(Boolean)){toast('Keep at least one mandatory check.');return;}
  asg.checks.forEach(c=>c.mandatory=d.m[c.id]);asg.config.threshold=d.threshold;asg.config.release=d.release;
  log(UI.user.name,'Updated settings for '+asg.title);toast('Settings saved. New submissions use them.');render();
}
function csv(){
  const rows=[['student','assignment','checks_passed','checks_total','decision','understanding_status','points','max_points']];
  S.threads.forEach(t=>{const v=lastV(t),p=points(t);rows.push([userOf(t.studentId).name,asgOf(t.asg).title,v.eval?v.eval.passed:'',v.eval?v.eval.total:'',v.decision||'',t.status,p.got,p.max]);});
  return rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
}
function copyCsv(){const t=csv();const done=()=>toast('CSV copied.');try{navigator.clipboard.writeText(t).then(done,()=>{toast('Copy was blocked. Select the table text instead.');});}catch(e){toast('Copy was blocked. Select the table text instead.');}}
function vReports(){
  const A=S.threads.filter(t=>t.asg==='A2'),n=A.length||1;
  const seg=k=>Math.round(A.filter(t=>t.status===k).length/n*100);
  let h='<div class="head"><div><h1>Reports</h1><p class="muted">Class report for '+esc(A2().title)+'</p></div><button class="btn" onclick="copyCsv()">Copy as CSV</button></div>';
  h+='<div class="card"><h3>Status mix</h3>';
  [['complete','Complete','ok'],['review','In Understanding Review','info'],['correction','In Guided Correction','warn'],['referred','Referred to instructor','warn'],['manual','On hold','mute']].forEach(([k,l])=>{h+='<div class="row" style="justify-content:space-between;margin-top:6px"><span>'+l+'</span><span class="mono">'+A.filter(t=>t.status===k).length+'</span></div><div class="bar"><span style="width:'+seg(k)+'%"></span></div>';});
  h+='</div><div class="card"><h3>By student</h3><div class="scroll"><table><thead><tr><th>Student</th><th>Test evidence</th><th>AI-assisted review</th><th>Instructor actions</th></tr></thead><tbody>'+
  S.threads.filter(t=>t.asg==='A2').map(t=>{const v=lastV(t),p=points(t);return '<tr class="click" onclick="openRec(\''+t.id+'\')"><td>'+esc(stuName(t))+'</td><td>'+(v.eval?v.eval.passed+' of '+v.eval.total+' checks, '+esc(v.decision):'not completed')+'</td><td>'+(p.max?p.got+' of '+p.max+' points':'none')+'</td><td>'+(t.actions.length?t.actions.map(a=>esc(a.label)).join('; '):'none')+'</td></tr>';}).join('')+'</tbody></table></div>'+
  '<div class="note" style="margin-top:12px">Columns are kept apart on purpose: test evidence, AI interpretation, and instructor decisions are different kinds of evidence. This report shows no AI-usage percentage and no misconduct finding.</div></div>';
  return h;
}

/* ---------- administrator views ---------- */
function vAccounts(){
  let h='<div class="head"><div><h1>Accounts</h1><p class="muted">Instructional and technical permissions stay separate.</p></div></div>';
  h+='<div class="card"><div class="scroll"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>'+S.users.map(u=>
   '<tr><td>'+esc(u.name)+'</td><td class="mono">'+esc(u.email)+'</td><td><select aria-label="Role for '+esc(u.name)+'" onchange="setRole(\''+u.id+'\',this.value)">'+['student','instructor','administrator'].map(r=>'<option '+(u.role===r?'selected':'')+'>'+r+'</option>').join('')+'</select></td><td>'+(u.active?pill('ok','active'):pill('mute','disabled'))+'</td><td><button class="btn sec sm" '+(u.id===UI.user.id?'disabled':'')+' onclick="toggleUser(\''+u.id+'\')">'+(u.active?'Disable':'Enable')+'</button></td></tr>').join('')+'</tbody></table></div></div>';
  h+='<div class="note">Administrators manage access and operation. Reviewing student work requires Instructor permissions.</div>';
  return h;
}
function setRole(id,r){const u=userOf(id);log(UI.user.name,'Changed role of '+u.email+' to '+r);u.role=r;toast('Role updated.');render();}
function toggleUser(id){const u=userOf(id);u.active=!u.active;log(UI.user.name,(u.active?'Enabled ':'Disabled ')+u.email);render();}
function vServices(){
  const items=[['evaluator','Evaluator service','Runs instructor-defined checks in a sandbox. Simulated here.'],['ai','AI service','Generates questions and scores answers. Simulated here.'],['pathB','Path B module (Team 2)','Hints and correction loop. Simulated here.']];
  let h='<div class="head"><div><h1>Services and Credentials</h1></div></div><div class="grid">';
  h+=items.map(([k,n,d])=>'<div class="card"><h3>'+n+'</h3><div style="margin:6px 0">'+(S.services[k]?pill('ok','running'):pill('bad','simulated outage'))+'</div><p class="muted">'+d+'</p><button class="btn sec sm" onclick="toggleSvc(\''+k+'\')">'+(S.services[k]?'Simulate outage':'Restore service')+'</button></div>').join('');
  h+='<div class="card"><h3>Router</h3><div style="margin:6px 0">'+pill('ok','running')+'</div><p class="muted">Rule-based and set by instructors. It does not depend on the AI.</p></div></div>';
  h+='<div class="note">Try an outage, then submit as a student. The work is saved and routed to manual review instead of being marked incorrect.</div>';
  h+='<div class="card"><h3>Approved AI credentials</h3><dl class="kv"><dt>Provider</dt><dd>Approved AI API (placeholder)</dd><dt>Key</dt><dd class="mono">••••••••••••a91f</dd><dt>Last rotated</dt><dd>'+fmt(S.keyRotated)+'</dd></dl><p class="muted">Credentials are never shown to other roles and never sent in a prompt.</p><button class="btn sec sm" onclick="rotateKey()">Rotate key</button></div>';
  return h;
}
function toggleSvc(k){S.services[k]=!S.services[k];log(UI.user.name,(S.services[k]?'Restored ':'Simulated outage of ')+k);render();}
function rotateKey(){S.keyRotated=new Date();log(UI.user.name,'Rotated AI credential');toast('Key rotated.');render();}
function vAudit(){
  return '<div class="head"><div><h1>Audit Log</h1><p class="muted">Pseudonymous student IDs only.</p></div></div><div class="card"><div class="scroll"><table><thead><tr><th>Time</th><th>Actor</th><th>Event</th></tr></thead><tbody>'+S.audit.slice(0,60).map(a=>'<tr><td>'+fmt(a.at)+'</td><td class="mono">'+esc(a.who)+'</td><td>'+esc(a.what)+'</td></tr>').join('')+'</tbody></table></div></div>';
}
function vBackups(){
  return '<div class="head"><div><h1>Backups and Retention</h1></div></div><div class="card"><h3>Backups</h3><div class="scroll"><table><thead><tr><th>Taken</th><th>Size</th></tr></thead><tbody>'+S.backups.map(b=>'<tr><td>'+fmt(b.at)+'</td><td>'+b.size+'</td></tr>').join('')+'</tbody></table></div><div style="margin-top:10px"><button class="btn" onclick="runBackup()">Run backup now</button></div></div>'+
  '<div class="card"><h3>Retention</h3><div class="note warn">No retention period has been approved. This prototype holds synthetic records only. Do not load real student data until an approved retention and access schedule exists.</div><dl class="kv"><dt>Student submissions</dt><dd>Configurable: active, archived, deleted</dd><dt>Assignment configurations</dt><dd>Kept separately; reusable</dd></dl></div>';
}
function runBackup(){S.backups.unshift({at:new Date(),size:'4.3 MB'});log(UI.user.name,'Ran backup');toast('Backup complete.');render();}

/* ---------- shell ---------- */
const VIEWS={home:vHome,submit:vSubmit,session:vSession,results:vResults,history:vHistory,overview:vOverview,records:vRecords,setup:vSetup,reports:vReports,accounts:vAccounts,services:vServices,audit:vAudit,backups:vBackups};
function loginView(){
  return '<div class="login"><div><h1>Understanding Review</h1><p>Submit your work, get requirement checks, then show you understand how your solution works. Instructors see the full evidence. Nothing here is an automatic grade or misconduct finding.</p>'+
  '<div class="note">Prototype with synthetic people and data. The evaluator and the AI are simulated.</div></div>'+
  '<form class="card" onsubmit="event.preventDefault();login()"><h3>Sign in</h3>'+
  (UI.loginErr?'<div class="note bad" role="alert">'+esc(UI.loginErr)+'</div>':'')+
  '<label for="em">Email</label><input id="em" value="'+esc(UI.email)+'" oninput="UI.email=this.value" style="width:100%" autocomplete="off">'+
  '<label for="pw">Password</label><input id="pw" type="password" value="'+esc(UI.pw)+'" oninput="UI.pw=this.value" style="width:100%">'+
  '<div style="margin-top:12px"><button class="btn" type="submit">Sign in</button></div>'+
  '<div class="muted" style="margin-top:14px">Demo accounts (password is "demo")</div><div class="demoacct"><button type="button" class="btn sec sm" onclick="quick(\'ava@school.edu\')">Student: Ava</button><button type="button" class="btn sec sm" onclick="quick(\'rivera@school.edu\')">Instructor: Dr. Rivera</button><button type="button" class="btn sec sm" onclick="quick(\'admin@school.edu\')">Administrator: Sam</button></div></form></div>';
}
function render(){
  const app=document.getElementById('app');
  let html='<div class="banner"><span>Prototype · synthetic data · evaluator and AI are simulated</span><button onclick="resetDemo()">Reset demo data</button></div>';
  if(!UI.user){html+=loginView();}
  else{
    const u=UI.user;
    html+='<div class="topbar"><div class="brand">Understanding Review</div><div class="who"><span>'+esc(u.name)+'</span>'+pill('info',u.role)+'<button class="btn sec sm" onclick="logout()">Sign out</button></div></div>';
    html+='<div class="shell"><nav class="rail" aria-label="Sections">'+NAV[u.role].map(([id,l])=>'<button class="'+(UI.view===id?'on':'')+'" onclick="go(\''+id+'\')">'+l+'</button>').join('')+'</nav><main class="main">'+(VIEWS[UI.view]?VIEWS[UI.view]():'')+'</main></div>';
  }
  if(UI.toast)html+='<div class="toast" role="status">'+esc(UI.toast)+'</div>';
  app.innerHTML=html;
}
render();
</script>
